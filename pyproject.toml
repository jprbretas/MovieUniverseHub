[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movieuniverse"
version = "1.0.0"
description = "MovieUniverse Hub: pesquisar filmes (API TMDB), criar playlists e dar notas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic-settings>=2.15",
    "httpx2>=2.13",
    "sqlalchemy>=2.0.54",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2"]                # servidor MCP: pip install -e ".[mcp]"
dev = ["pytest>=9.0", "mcp>=2.2"]  # testes (incluem os do servidor MCP): pip install -e ".[dev]"

[tool.setuptools.package-data]
movieuniverse = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
