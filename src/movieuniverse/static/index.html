<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieUniverse Hub</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <header class="topo">
        <a href="#/" class="marca">MovieUniverse <span class="destaque">Hub</span></a>

        <form id="form-pesquisa" class="pesquisa" role="search">
            <input id="campo-pesquisa" type="search" name="titulo" required maxlength="200"
                   placeholder="Pesquisar filmes por título…" aria-label="Título do filme">
            <button type="submit">Pesquisar</button>
        </form>

        <!-- "Entrar" com o nome, ou "Olá, <nome> · Sair" (desenhado pelo js/app.js) -->
        <div id="area-utilizador" class="area-utilizador"></div>

        <nav class="menu">
            <a href="#/">Início</a>
            <a href="#/sobre">Sobre</a>
        </nav>
    </header>

    <!-- Cada "ecrã" é desenhado aqui dentro pelo js/app.js, conforme o endereço depois do #. -->
    <main id="conteudo" class="conteudo" aria-live="polite"></main>

    <footer class="rodape">
        Dados dos filmes: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
        Este produto usa a API da TMDB, mas não é endossado nem certificado pela TMDB.
    </footer>

    <!-- Menu que abre ao clicar na ★ (posicionado pelo js/estrela.js) -->
    <div id="menu-estrela" class="menu-estrela" hidden></div>

    <!-- type="module" permite usar import/export entre ficheiros JS (≈ using/namespaces). -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
