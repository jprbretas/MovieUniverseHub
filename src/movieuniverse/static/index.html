<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1020">
    <title>MovieUniverse Hub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fontes/sora.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>

    <header class="topo">
        <div class="topo-interior">
            <a href="#/" class="marca" aria-label="MovieUniverse Hub, início">
                <svg class="marca-logo" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="gradiente-logo" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#8b5cf6"/>
                            <stop offset="1" stop-color="#22d3ee"/>
                        </linearGradient>
                    </defs>
                    <g transform="rotate(-18 16 16)">
                        <ellipse cx="16" cy="16" rx="15" ry="4.6" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity=".45"/>
                        <circle cx="16" cy="16" r="9.5" fill="url(#gradiente-logo)"/>
                        <path d="M1 16a15 4.6 0 0 0 30 0" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
                    </g>
                    <path d="M13.6 11.6v8.8l7.2-4.4z" fill="#0f1020"/>
                </svg>
                <span class="marca-nome">MovieUniverse <span class="destaque">Hub</span></span>
            </a>

            <nav class="menu" aria-label="Principal">
                <a href="#/" data-rota="/">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span>Início</span>
                </a>
                <a href="#/comparar" data-rota="/comparar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h13M17 12l4 4-4 4M21 16H8"/></svg>
                    <span>Comparar</span>
                </a>
                <a href="#/sobre" data-rota="/sobre">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
                    <span>Sobre</span>
                </a>
            </nav>

            <form id="form-pesquisa" class="pesquisa form-pesquisa" role="search">
                <button type="submit" class="pesquisa-botao" aria-label="Pesquisar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                </button>
                <input id="campo-pesquisa" type="search" name="titulo" required maxlength="200"
                       placeholder="Pesquisar filmes…" aria-label="Título do filme" autocomplete="off">
                <kbd class="atalho" title="Carrega em / para pesquisar">/</kbd>
            </form>

            <!-- "Entrar" com o nome, ou o avatar com "Sair" (desenhado pelo js/app.js) -->
            <div id="area-utilizador" class="area-utilizador"></div>
        </div>
    </header>

    <!-- Cada "ecrã" é desenhado aqui dentro pelo js/app.js, conforme o endereço depois do #. -->
    <main id="conteudo" class="conteudo" tabindex="-1" aria-live="polite"></main>

    <footer class="rodape">
        <p>
            Dados e imagens dos filmes: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
            Este produto usa a API da TMDB, mas não é endossado nem certificado pela TMDB.
        </p>
    </footer>

    <!-- Menu que abre ao clicar na ★ (posicionado pelo js/estrela.js) -->
    <div id="menu-estrela" class="menu-estrela" hidden></div>

    <!-- Avisos curtos (js/avisos.js) e a caixa de confirmação -->
    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
    <dialog id="dialogo" class="dialogo">
        <form method="dialog">
            <p id="dialogo-texto"></p>
            <div class="dialogo-botoes">
                <button type="submit" value="nao" class="botao-secundario">Cancelar</button>
                <button type="submit" value="sim" class="botao-perigo" id="dialogo-confirmar">Confirmar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
